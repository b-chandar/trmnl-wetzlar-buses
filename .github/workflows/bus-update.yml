name: Update TRMNL Bus Display

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-display:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch bus data and update TRMNL
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime
          
          try:
              # Configuration
              RMV_API_KEY = "${{ secrets.RMV_API_KEY }}"
              STOP_ID = "3019349"
              TRMNL_WEBHOOK = "${{ secrets.TRMNL_WEBHOOK_URL }}"
              
              # Fetch departures from RMV API
              url = f"https://www.rmv.de/hapi/departureBoard?id={STOP_ID}&accessId={RMV_API_KEY}&format=json"
              
              print(f"Fetching from: {url}")
              response = requests.get(url, timeout=10)
              print(f"Response status: {response.status_code}")
              
              if response.status_code != 200:
                  print(f"Error: {response.status_code} {response.text}")
                  raise Exception(f"API returned {response.status_code}")
              
              data = response.json()
              departures = data.get('Departure', [])[:6]
              
              print(f"Got {len(departures)} departures")
              
              # Build simple HTML
              now = datetime.now()
              html = "<div style='font-family:Arial;padding:10px'>"
              html += "<h3 style='margin:0'>WETZLAR BUS</h3>"
              html += "<p style='font-size:11px;margin:5px 0'>Hermannstein An der Dillbrücke</p>"
              html += f"<p style='font-size:10px;opacity:0.6'>Updated {now.strftime('%H:%M')}</p>"
              
              if departures:
                  html += "<div>"
                  for dep in departures:
                      time = dep.get('rtTime', dep.get('time', 'N/A'))[:5]
                      line = dep.get('name', '?').replace('Bus ', '')
                      direction = dep.get('direction', '?')
                      html += f"<div style='display:grid;grid-template-columns:40px 60px 1fr 50px;gap:8px;padding:5px 0;border-bottom:1px solid #ccc'>"
                      html += f"<div style='background:#000;color:#fff;text-align:center;font-weight:bold'>{line}</div>"
                      html += f"<div style='text-align:center;font-weight:bold'>{time}</div>"
                      html += f"<div style='font-size:12px'>{direction}</div>"
                      html += f"<div style='text-align:right'>→</div>"
                      html += "</div>"
                  html += "</div>"
              else:
                  html += "<p>No departures</p>"
              
              html += "</div>"
              
              # Send to TRMNL
              # Try sending HTML directly (not wrapped in merge_variables)
              payload = html
              
              print(f"Sending to TRMNL...")
              print(f"Payload length: {len(payload)}")
              webhook_response = requests.post(
                  TRMNL_WEBHOOK,
                  data=payload,
                  headers={"Content-Type": "text/html"},
                  timeout=10
              )
              print(f"TRMNL Response: {webhook_response.status_code}")
              webhook_response.raise_for_status()
              
              print("✅ Success!")
              
          except Exception as e:
              print(f"❌ Error: {str(e)}")
              import traceback
              traceback.print_exc()
              exit(1)
          
          EOF
