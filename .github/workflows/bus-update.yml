name: Update TRMNL Bus Display

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-display:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch bus data and update TRMNL
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime
          
          try:
              # Configuration
              RMV_API_KEY = "${{ secrets.RMV_API_KEY }}"
              STOP_ID = "3019349"
              TRMNL_WEBHOOK = "${{ secrets.TRMNL_WEBHOOK_URL }}"
              
              # Fetch departures from RMV API
              url = f"https://www.rmv.de/hapi/departureBoard?id={STOP_ID}&accessId={RMV_API_KEY}&format=json"
              
              print(f"Fetching from: {url}")
              response = requests.get(url, timeout=10)
              print(f"Response status: {response.status_code}")
              
              if response.status_code != 200:
                  print(f"Error: {response.status_code} {response.text}")
                  raise Exception(f"API returned {response.status_code}")
              
              data = response.json()
              departures = data.get('Departure', [])[:6]
              
              print(f"Got {len(departures)} departures")
              
              # Build minimal HTML (must be under 2KB for free TRMNL)
              now = datetime.now()
              html = f"<div style='padding:5px'><b>WETZLAR BUS</b><br><span style='font-size:10px'>An der Dillbrücke • {now.strftime('%H:%M')}</span><hr style='margin:5px 0'>"
              
              if departures:
                  for dep in departures[:4]:  # Only show 4 departures to save space
                      time = dep.get('rtTime', dep.get('time', 'N/A'))[:5]
                      line = dep.get('name', '?').replace('Bus ', '')
                      direction = dep.get('direction', '?')[:20]  # Truncate direction
                      html += f"<div style='display:grid;grid-template-columns:35px 50px 1fr;gap:5px;font-size:11px;margin:3px 0'><b>{line}</b> <b>{time}</b> {direction}</div>"
              else:
                  html += "<p>No data</p>"
              
              html += "</div>"
              
              # Send to TRMNL with merge_variables format
              payload = {
                  "merge_variables": {
                      "html": html
                  }
              }
              
              print(f"Payload size: {len(str(payload))} bytes (limit: 2048)")
              webhook_response = requests.post(TRMNL_WEBHOOK, json=payload, timeout=10)
              print(f"TRMNL Response: {webhook_response.status_code}")
              webhook_response.raise_for_status()
              
              print("✅ Success!")
              
          except Exception as e:
              print(f"❌ Error: {str(e)}")
              import traceback
              traceback.print_exc()
              exit(1)
          
          EOF
