name: Update TRMNL Bus Display

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-display:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch bus data and update TRMNL
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime
          
          try:
              # Configuration
              RMV_API_KEY = "${{ secrets.RMV_API_KEY }}"
              STOP_ID = "3019349"
              TRMNL_WEBHOOK = "${{ secrets.TRMNL_WEBHOOK_URL }}"
              
              # Fetch departures from RMV API
              url = f"https://www.rmv.de/hapi/departureBoard?id={STOP_ID}&accessId={RMV_API_KEY}&format=json"
              
              print(f"Fetching from: {url}")
              response = requests.get(url, timeout=10)
              print(f"Response status: {response.status_code}")
              
              if response.status_code != 200:
                  print(f"Error: {response.status_code} {response.text}")
                  raise Exception(f"API returned {response.status_code}")
              
              data = response.json()
              all_departures = data.get('Departure', [])
              
              # Filter to only show buses going to Wetzlar Bahnhof/ZOB
              departures = [dep for dep in all_departures if 'Bahnhof' in dep.get('direction', '')][:6]
              
              print(f"Got {len(departures)} departures")
              
              # Build styled HTML with stop name and duration
              html = """<div style='padding:8px;font-family:Arial,sans-serif;font-size:13px;line-height:1.6'>
<div style='font-weight:bold;font-size:14px;margin-bottom:2px'>Hermannstein An der Dillbrücke</div>
<div style='font-size:11px;opacity:0.8;margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid #000'>
BUS  TIME  DESTINATION            DUR
</div>"""
              
              if departures:
                  for i, dep in enumerate(departures[:5]):
                      time = dep.get('rtTime', dep.get('time', 'N/A'))[:5]
                      line = dep.get('name', '?').replace('Bus ', '').strip()
                      direction = 'Wetzlar Bahnhof'  # Fixed destination
                      duration = '18m'  # Journey to Bahnhof typically ~18 minutes
                      
                      bg = 'background:#f0f0f0;' if i % 2 == 0 else ''
                      html += f"<div style='{bg}padding:4px 0;margin:2px 0;border-bottom:1px solid #ddd'><span style='font-weight:bold;display:inline-block;width:30px'>{line}</span> <span style='display:inline-block;width:45px'>{time}</span> <span style='display:inline-block;width:90px'>{direction}</span> {duration}</div>"
              
              html += "</div>"
              
              # Send to TRMNL with merge_variables format
              payload = {
                  "merge_variables": {
                      "html": html
                  }
              }
              
              print(f"Payload size: {len(str(payload))} bytes (limit: 2048)")
              webhook_response = requests.post(TRMNL_WEBHOOK, json=payload, timeout=10)
              print(f"TRMNL Response: {webhook_response.status_code}")
              webhook_response.raise_for_status()
              
              print("✅ Success!")
              
          except Exception as e:
              print(f"❌ Error: {str(e)}")
              import traceback
              traceback.print_exc()
              exit(1)
          
          EOF
