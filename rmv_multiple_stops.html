<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetzlar Bus Stops - RMV API Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #fff;
            color: #000;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            font-size: 14px;
            line-height: 1.2;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            border-bottom: 3px solid #000;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        
        .timestamp {
            font-size: 10px;
            margin-top: 3px;
            opacity: 0.7;
        }
        
        .bus-stop-section {
            margin-bottom: 18px;
            border-left: 3px solid #000;
            padding-left: 10px;
        }
        
        .stop-name {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        
        .departures-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        
        .departure-row {
            display: grid;
            grid-template-columns: 40px 60px 1fr 70px;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #ccc;
            align-items: center;
            font-size: 12px;
        }
        
        .departure-row:last-child {
            border-bottom: none;
        }
        
        .departure-row.next {
            font-weight: bold;
            background-color: #f5f5f5;
            padding: 8px 5px;
            margin: 2px -5px;
        }
        
        .line-badge {
            background-color: #000;
            color: #fff;
            padding: 3px 6px;
            border-radius: 2px;
            font-weight: bold;
            text-align: center;
            font-size: 12px;
            min-width: 35px;
        }
        
        .departure-time {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }
        
        .departure-destination {
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .mins-until {
            text-align: right;
            font-size: 12px;
            font-weight: bold;
        }
        
        .mins-until.imminent {
            color: #000;
        }
        
        .footer {
            margin-top: 15px;
            padding-top: 8px;
            border-top: 2px solid #000;
            font-size: 9px;
            opacity: 0.6;
        }
        
        .error {
            background-color: #fff;
            padding: 12px;
            border: 2px solid #000;
            margin: 15px 0;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }
        
        .config-section {
            background-color: #f0f0f0;
            padding: 12px;
            border-radius: 3px;
            margin-bottom: 15px;
            font-size: 11px;
        }
        
        .config-section h3 {
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .config-code {
            background-color: #fff;
            padding: 8px;
            border-left: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            margin: 8px 0;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">NEARBY BUS STOPS</div>
            <div class="timestamp">Updated: <span id="updateTime">--:--</span></div>
        </div>
        
        <div id="content" class="loading">Loading schedules...</div>
        
        <div class="footer">
            <p>Data source: RMV Open Data API • Auto-updates every 15 minutes</p>
        </div>
    </div>
    
    <script>
        // ========== CONFIGURATION ==========
        // You need to request an API key from: https://www.rmv.de/s/de/rmv-open-data
        const API_KEY = 'YOUR_RMV_API_KEY_HERE'; // Replace with your API key
        const API_BASE = 'https://www.rmv.de/hapi/';
        
        // Configure your bus stops here
        // Format: { id: 'STOP_ID', name: 'Stop Name' }
        const BUS_STOPS = [
            // { id: '3006905', name: 'Bus Stop 1' },
            // { id: '3006906', name: 'Bus Stop 2' },
            // { id: '3006907', name: 'Bus Stop 3' },
        ];
        
        const REFRESH_INTERVAL = 15 * 60 * 1000; // 15 minutes
        const DEPARTURES_PER_STOP = 4; // Show this many departures per stop
        
        // ========== HELPER FUNCTIONS ==========
        
        async function searchStop(stopName) {
            try {
                const url = `${API_BASE}location.name?input=${encodeURIComponent(stopName)}&accessId=${API_KEY}&format=json`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.stopLocationOrCoordLocation && data.stopLocationOrCoordLocation.length > 0) {
                    const stop = data.stopLocationOrCoordLocation[0];
                    console.log(`Found: ${stop.StopLocation.name} (ID: ${stop.StopLocation.id})`);
                    return stop.StopLocation;
                }
            } catch (error) {
                console.error('Error searching for stop:', error);
            }
            return null;
        }
        
        async function getDepartures(stopId) {
            try {
                const url = `${API_BASE}departureBoard?id=${stopId}&accessId=${API_KEY}&format=json`;
                const response = await fetch(url);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(`Error fetching departures for stop ${stopId}:`, error);
                return null;
            }
        }
        
        // ========== DISPLAY FUNCTIONS ==========
        
        function displayDepartures(stops) {
            const contentDiv = document.getElementById('content');
            
            if (!stops || stops.length === 0) {
                displayError('No stops configured');
                return;
            }
            
            let html = '';
            
            stops.forEach((stopData, stopIndex) => {
                if (!stopData.departures || stopData.departures.length === 0) {
                    return; // Skip stops with no departures
                }
                
                html += `<div class="bus-stop-section">`;
                html += `<div class="stop-name">${stopData.name}</div>`;
                html += `<div class="departures-list">`;
                
                stopData.departures.slice(0, DEPARTURES_PER_STOP).forEach((dep, depIndex) => {
                    const isNext = depIndex === 0;
                    const lineNumber = dep.line || dep.Product?.line || '?';
                    const destination = dep.direction || 'Unknown';
                    const minsUntil = dep.minsUntil || 0;
                    
                    html += `
                        <div class="departure-row ${isNext ? 'next' : ''}">
                            <div class="line-badge">${lineNumber}</div>
                            <div class="departure-time">${dep.time}</div>
                            <div class="departure-destination">${destination}</div>
                            <div class="mins-until ${isNext ? 'imminent' : ''}">${minsUntil}m</div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            });
            
            contentDiv.innerHTML = html || '<div class="error">No departures available</div>';
        }
        
        function displayError(message = 'Unable to load schedules') {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="config-section">
                    <h3>⚠️ Setup Required</h3>
                    <p>${message}</p>
                    <p style="margin-top: 8px;"><strong>Configuration Steps:</strong></p>
                    <ol style="margin-left: 15px; margin-top: 5px; font-size: 10px;">
                        <li>Request API key: <strong>rmv.de/s/de/rmv-open-data</strong></li>
                        <li>Find your stop IDs using location search</li>
                        <li>Update BUS_STOPS array in script</li>
                        <li>Replace API_KEY value</li>
                    </ol>
                    <h3 style="margin-top: 10px;">Finding Stop IDs</h3>
                    <div class="config-code">
https://www.rmv.de/hapi/location.name?input=YourStopName&accessId=YOUR_KEY&format=json
                    </div>
                    <p>Example BUS_STOPS configuration:</p>
                    <div class="config-code">
const BUS_STOPS = [
  { id: '3006905', name: 'Stop 1' },
  { id: '3006906', name: 'Stop 2' },
  { id: '3006907', name: 'Stop 3' }
];
                    </div>
                </div>
                ${generateSampleSchedule()}
            `;
        }
        
        function generateSampleSchedule() {
            const now = new Date();
            const sampleStops = [
                { name: 'Sample Stop 1', id: '1' },
                { name: 'Sample Stop 2', id: '2' },
                { name: 'Sample Stop 3', id: '3' }
            ];
            
            let html = '';
            
            sampleStops.forEach(stop => {
                html += `<div class="bus-stop-section">`;
                html += `<div class="stop-name">${stop.name}</div>`;
                html += `<div class="departures-list">`;
                
                const times = [2, 7, 12, 17];
                const lines = ['10', '12', '16', '18'];
                const destinations = ['Bahnhof', 'Steindorf', 'Asslar', 'Haiger'];
                
                times.forEach((mins, idx) => {
                    const depTime = new Date(now.getTime() + mins * 60000);
                    const isNext = idx === 0;
                    
                    html += `
                        <div class="departure-row ${isNext ? 'next' : ''}">
                            <div class="line-badge">${lines[idx]}</div>
                            <div class="departure-time">${depTime.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'})}</div>
                            <div class="departure-destination">${destinations[idx]}</div>
                            <div class="mins-until ${isNext ? 'imminent' : ''}">${mins}m</div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            });
            
            return html;
        }
        
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('updateTime').textContent = 
                now.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
        }
        
        // ========== INITIALIZATION ==========
        
        async function initialize() {
            updateTimestamp();
            
            // Check if API key is configured
            if (API_KEY === 'YOUR_RMV_API_KEY_HERE') {
                displayError('API key not configured');
                return;
            }
            
            // Check if stops are configured
            if (BUS_STOPS.length === 0) {
                displayError('No bus stops configured in BUS_STOPS array');
                return;
            }
            
            // Fetch departures for all stops
            try {
                const allStopsData = [];
                
                for (const stop of BUS_STOPS) {
                    const departureData = await getDepartures(stop.id);
                    
                    if (departureData && departureData.Departure) {
                        const departures = departureData.Departure.map(dep => {
                            const depTime = new Date(dep.dateTime);
                            const now = new Date();
                            const minsUntil = Math.max(0, Math.round((depTime - now) / 60000));
                            
                            return {
                                time: depTime.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}),
                                line: dep.Product?.line || dep.Product?.name || '?',
                                direction: dep.direction || 'Unknown',
                                minsUntil: minsUntil,
                                dateTime: depTime
                            };
                        });
                        
                        allStopsData.push({
                            name: stop.name,
                            id: stop.id,
                            departures: departures
                        });
                    } else {
                        console.warn(`No departures found for stop: ${stop.name}`);
                    }
                }
                
                if (allStopsData.length > 0) {
                    displayDepartures(allStopsData);
                } else {
                    displayError('No departures found for configured stops');
                }
            } catch (error) {
                console.error('Initialization error:', error);
                displayError('Error fetching data');
            }
        }
        
        // Initial load
        initialize();
        
        // Update timestamp every minute
        setInterval(updateTimestamp, 60000);
        
        // Refresh schedule every 15 minutes
        setInterval(initialize, REFRESH_INTERVAL);
    </script>
</body>
</html>
